name: Social Drive validation
on:
  pull_request:
    paths:
      - 'src/modules/Social*'
      - 'supabase/functions/social-drive-*/**'
      - 'supabase/migrations/*social_drive*'
      - 'tests/**'
      - '.github/workflows/social-drive-check.yml'
  push:
    branches: [feature/social-google-drive]
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --reporter=default
