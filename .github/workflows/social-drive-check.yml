name: Social Drive validation
on:
  pull_request:
    paths:
      - 'src/modules/Social*'
      - 'supabase/functions/social-drive-*/**'
      - 'supabase/migrations/*social_drive*'
      - 'supabase/functions/_shared/social-drive.ts'
      - 'supabase/tests/drive/**'
      - 'src/main.tsx'
      - 'tests/**'
      - '.github/workflows/social-drive-check.yml'
  push:
    branches: [feature/social-google-drive]
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Vite build requires authorized Cloudflare build credentials and a live Supabase check.
      # Typecheck independently without exposing deployment secrets to CI.
      - run: npx tsc -b
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-env --no-lock --node-modules-dir=none supabase/tests/drive/edge_test.ts
      - run: npm test -- --reporter=default
